name: Heavy validation

# Full suite, lint, strict types and both mutation tools on the same target, with the time of each
# step in the job summary. It runs only on a validation/** branch or by hand; it never runs on main.
on:
  push:
    branches: ["validation/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && pip install --group dev pytest-asyncio pytest-cov
      - name: ruff
        run: ruff check scripts tests examples .claude/hooks
      - name: mypy strict
        run: mypy --strict scripts
      - name: full pytest
        run: |
          s=$(date +%s); python -m pytest -q --cov=src --cov=scripts --cov-report=term | tail -40; e=$(date +%s)
          echo "full pytest: $((e-s)) s" >> "$GITHUB_STEP_SUMMARY"

  mutmut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install --group dev pytest-asyncio mutmut==3.8.0 "pytest==8.4.2"
      - name: mutmut on src/afaw_web
        run: |
          printf '[mutmut]\nsource_paths=src/afaw_web/\nonly_mutate=src/afaw_web/app.py\n  src/afaw_web/search.py\npytest_add_cli_args_test_selection=tests/web\n' > setup.cfg
          s=$(date +%s.%N); python -m mutmut run; e=$(date +%s.%N)
          python -m mutmut results --all | awk '{print $NF}' | sort | uniq -c | tee results.txt
          echo "mutmut: $(echo "$e - $s" | bc) s; nproc=$(nproc)" >> "$GITHUB_STEP_SUMMARY"
          cat results.txt >> "$GITHUB_STEP_SUMMARY"

  cosmic-ray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install --group dev pytest-asyncio cosmic-ray==8.7.0
      - name: cosmic-ray on src/afaw_web
        run: |
          cat > cr.toml <<'T'
          [cosmic-ray]
          module-path = "src/afaw_web"
          timeout = 30.0
          excluded-modules = ["src/afaw_web/main.py", "src/afaw_web/settings.py", "src/afaw_web/__init__.py"]
          test-command = "python -m pytest -x -q tests/web"
          [cosmic-ray.distributor]
          name = "local"
          T
          sed -i 's/^          //' cr.toml
          cosmic-ray init cr.toml cr.sqlite
          cosmic-ray baseline cr.toml
          s=$(date +%s.%N); cosmic-ray exec cr.toml cr.sqlite; e=$(date +%s.%N)
          cosmic-ray dump cr.sqlite | wc -l
          echo "cosmic-ray exec: $(echo "$e - $s" | bc) s" >> "$GITHUB_STEP_SUMMARY"
          cr-rate cr.sqlite | tee -a "$GITHUB_STEP_SUMMARY"
