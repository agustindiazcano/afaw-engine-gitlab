# AFAW Hands-off: the nine GitLab DevSecOps stages. Every job runs a deterministic AFAW script
# or a GitLab-native feature, and fails loudly; no job passes without having measured something.
# Human-only file: only a human changes this file (AGENTS.md section 18.10).
# The nine stages. "test" is declared only because the GitLab SAST and secret-detection templates
# require it (docs.gitlab.com/user/application_security/sast); none of our jobs runs in it.
stages: [plan, create, verify, test, secure, govern, package, configure, release, monitor]

# Merge request pipelines replace branch pipelines while a merge request is open, so a push does
# not run everything twice (docs.gitlab.com/ci/yaml/workflow).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  GIT_DEPTH: "0" # the scripts diff against the default branch and read the history
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Set to "buildah" (project CI/CD variable or a manual run) when privileged Docker-in-Docker
  # is not allowed on the runners.
  PACKAGE_BUILDER: "docker"

default:
  image: python:3.12 # the full image: the scripts need git
  cache:
    key:
      files: [pyproject.toml]
    paths: [.cache/pip]

# Jobs that compare the branch with the default branch run on merge requests and on branches
# other than the default one.
.on_change:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

.base_ref:
  before_script:
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - export BASE="origin/$CI_DEFAULT_BRANCH"
    - export HEAD_BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_BRANCH}"

.python_dev:
  before_script:
    - python -m pip install --upgrade pip
    - pip install --group dev

# ---- plan: task files and project knowledge ------------------------------------------------
task_files:
  stage: plan
  extends: [.on_change, .base_ref]
  script:
    - python -m scripts.check_task_files --base "$(git merge-base $BASE HEAD)" --head-branch "$HEAD_BRANCH" --target "$BASE"

docs_check:
  stage: plan
  script:
    - python -m scripts.check_docs

# The Duo configuration files (agent config, review instructions, subagents, custom flow) use
# only the keys, tools and limits that docs.gitlab.com documents.
duo_config:
  stage: plan
  extends: [.python_dev]
  script:
    - python -m scripts.check_duo_config

# ---- create: the change record and the derived views ---------------------------------------
task_delta:
  stage: create
  extends: [.on_change, .base_ref]
  script:
    - python -m scripts.check_task_delta --base "$BASE"

derived_views:
  stage: create
  script:
    - python -m scripts.build_state --ref HEAD --out build/state

# Assembles the data baked into the web service image: this repository's live views, the demo
# page built from mock data, and the ADRs and gotchas the read-only /api/ask searches.
web_data:
  stage: create
  script:
    # The project is public, so the facts need no token; without them the dashboard shows no data.
    - python -m scripts.collect_facts --ref HEAD --out build/facts.json
    - python -m scripts.build_state --ref HEAD --out build/web-data/live --facts build/facts.json
    - python -m examples.mock_dashboard build/web-data/demo
    - mkdir -p build/web-data/docs
    - cp -r docs/adr docs/gotchas build/web-data/docs/
  artifacts:
    paths: [build/web-data/]
    expire_in: 1 week

# ---- verify: lint, types, tests, red-first and the mutation gate ---------------------------
lint:
  stage: verify
  extends: [.python_dev]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes: &code_paths
        paths:
          - "scripts/**/*"
          - "src/**/*"
          - "Dockerfile"
          - "tests/**/*"
          - "examples/**/*"
          - ".claude/hooks/**/*"
          - "state/schemas/**/*"
          - "state/config.json"
          - "pyproject.toml"
          - ".gitlab-ci.yml"
        compare_to: refs/heads/main
  script:
    - ruff check scripts src tests examples .claude/hooks

typecheck:
  stage: verify
  extends: [.python_dev]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes: *code_paths
  script:
    - mypy --strict scripts src

tests:
  stage: verify
  extends: [.python_dev]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes: *code_paths
  script:
    - git config --global user.email "ci@example.com"
    - git config --global user.name "CI"
    - pytest tests/tooling tests/web -q

red_check:
  stage: verify
  extends: [.on_change]
  before_script:
    - !reference [.python_dev, before_script]
    - !reference [.base_ref, before_script]
  script:
    - python -m scripts.red_check --base "$BASE"

mutation_gate:
  stage: verify
  extends: [.on_change, .base_ref]
  before_script:
    - !reference [.python_dev, before_script]
    - !reference [.base_ref, before_script]
    # The version measured on this runner (docs/submission/mutation-tools-measurement.md).
    - pip install mutmut==3.8.0
  script:
    # mutmut needs fork support: it runs on this Linux runner, not on Windows. With no mandatory
    # file the engine runs nothing; with mandatory files and no results the gate fails.
    - python -m scripts.mutation_engine --base "$BASE" --out build/mutation.json
    - python -m scripts.mutation_ci --base "$BASE" --results build/mutation.json
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/mutation.json]

# ---- secure: GitLab-native SAST and secret detection ---------------------------------------
# The templates run in the test stage and, by default, only in branch pipelines. Their jobs are
# moved to the secure stage and also run in merge request pipelines.
# The scanner jobs fail only when the scanner itself breaks, not when it finds something, so
# they no longer tolerate failure and security_gate reads their reports to decide.
semgrep-sast:
  stage: secure
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

secret_detection:
  stage: secure
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Blocks on any secret finding and on Critical or High SAST findings; lower ones are printed.
security_gate:
  stage: secure
  needs: [semgrep-sast, secret_detection]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - python -m scripts.security_gate --sast gl-sast-report.json --secrets gl-secret-detection-report.json

# ---- govern: checks that need no tooling image ---------------------------------------------
paper_pdf:
  stage: govern
  extends: [.on_change, .base_ref]
  script:
    - |
      changed=$(git diff --name-only "$BASE...HEAD")
      if echo "$changed" | grep -qE '^(docs/paper/afaw\.tex|AGENTS\.md|docs/img/)' \
         && ! echo "$changed" | grep -qx 'docs/paper/afaw.pdf'; then
        echo "PROBLEM: the paper's sources changed but docs/paper/afaw.pdf did not."
        echo "Rebuild it (docs/paper/README.md) and commit the PDF in this merge request."
        exit 1
      fi
      echo "OK: paper PDF in step with its sources."

# Compiles the paper, so nobody needs LaTeX on their machine: download the artifact
# docs/paper/afaw.pdf from this job and commit it in the same merge request. The image tag
# (a fixed TeX Live release) was checked on Docker Hub. It runs when a source of the paper
# differs from main (not from the previous push), or on a manual run from the pipelines page ("Run pipeline").
paper_build:
  stage: govern
  image: texlive/texlive:TL2025-historic
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: [AGENTS.md, docs/paper/afaw.tex, "docs/img/**/*"]
        compare_to: "refs/heads/main"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        paths: [AGENTS.md, docs/paper/afaw.tex, "docs/img/**/*"]
        compare_to: "refs/heads/main"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends fonts-liberation python3
    - python3 -m scripts.rules_to_tex AGENTS.md docs/paper/appendix_rules.tex
    - cd docs/paper
    - xelatex -interaction=nonstopmode -halt-on-error afaw.tex
    - xelatex -interaction=nonstopmode -halt-on-error afaw.tex
  artifacts:
    paths: [docs/paper/afaw.pdf]
    expire_in: 1 week

# WEAK backup control: this job is part of .gitlab-ci.yml, so the same merge request can edit
# it away. It enforces nothing on its own. The strong control is deferred (PENDING.md, FINAL).
# AFAW_BOT_USER_IDS is a group-level CI variable that task 011 fills with the service account.
human_only_files:
  stage: govern
  extends: [.on_change, .base_ref]
  script:
    - python -m scripts.human_only_files --base "$BASE"

equivalent_mutants_report:
  stage: govern
  extends: [.on_change, .base_ref]
  script:
    - |
      if git diff --quiet "$BASE...HEAD" -- state/equivalent_mutants.json; then
        echo "state/equivalent_mutants.json is unchanged."
      else
        echo "state/equivalent_mutants.json changed in this merge request. Only the human may write it. Review every line:"
        git diff "$BASE...HEAD" -- state/equivalent_mutants.json
      fi

# ---- package: the web service image in the GitLab Container Registry -----------------------------
# docker:dind needs a privileged runner. If that is refused, set PACKAGE_BUILDER=buildah.
# Kaniko is not an option: GitLab's documentation marks it as no longer maintained.
package_docker:
  stage: package
  needs: [web_data]
  image: docker:24.0.5-cli
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $PACKAGE_BUILDER == "buildah"
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/afaw-web:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/afaw-web:$CI_COMMIT_SHA"

package_buildah:
  stage: package
  needs: [web_data]
  image: quay.io/buildah/stable:v1.43.5 # pinned; tag verified on quay.io
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
  rules:
    - if: $PACKAGE_BUILDER != "buildah"
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - buildah build -t "$CI_REGISTRY_IMAGE/afaw-web:$CI_COMMIT_SHA" .
    - buildah push "$CI_REGISTRY_IMAGE/afaw-web:$CI_COMMIT_SHA"

# ---- configure: the settings and CI variables the pipeline depends on ----------------------
# Validates state/config.json against its schema and checks the CI variables by name only,
# never printing a value. The Google Cloud variables are protected, so they are required only on
# protected refs (main), where the deploy runs.
check_configuration:
  stage: configure
  script:
    - python -m scripts.check_ci_config

# The Terraform in deploy/terraform is formatted and valid. It is applied by a human, never here.
terraform_validate:
  stage: configure
  image:
    name: hashicorp/terraform:1.16.7 # pinned; tag verified on Docker Hub
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        paths: ["deploy/terraform/**/*"]
        compare_to: refs/heads/main
  script:
    - terraform -chdir=deploy/terraform fmt -check -recursive
    - terraform -chdir=deploy/terraform init -backend=false -input=false
    - terraform -chdir=deploy/terraform validate

# ---- release: a GitLab Release for every commit that reaches the default branch -----------
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.124.0 # pinned; tag verified in the registry
  needs:
    - job: package_docker
      optional: true
    - job: package_buildah
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "Releasing v0.$CI_PIPELINE_IID, image $CI_REGISTRY_IMAGE/afaw-web:$CI_COMMIT_SHA"
  release:
    tag_name: "v0.$CI_PIPELINE_IID"
    name: "AFAW Hands-off v0.$CI_PIPELINE_IID"
    description: "Image `$CI_REGISTRY_IMAGE/afaw-web:$CI_COMMIT_SHA`, commit $CI_COMMIT_SHA."
    ref: "$CI_COMMIT_SHA"

# ---- deploy to Cloud Run (same stage as the release) ---------------------------------------
# Cloud Run cannot pull from the GitLab registry, so the image built in package is copied to
# Artifact Registry. Authentication is Workload Identity Federation with the job's OIDC token
# (aud matches the provider in deploy/terraform); no service-account key exists anywhere. The
# Google Cloud variables are protected, so these jobs run only on main.
publish_image:
  stage: release
  image: docker:24.0.5-cli
  services:
    - docker:24.0.5-dind
  needs:
    - job: package_docker
      optional: true
    - job: package_buildah
      optional: true
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apk add --no-cache curl
    - GCP_TOKEN="$(sh deploy/gcp_access_token.sh)"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - echo "$GCP_TOKEN" | docker login -u oauth2accesstoken --password-stdin "${GCP_ARTIFACT_REPOSITORY%%/*}"
    - docker pull "$CI_REGISTRY_IMAGE/afaw-web:$CI_COMMIT_SHA"
    - docker tag "$CI_REGISTRY_IMAGE/afaw-web:$CI_COMMIT_SHA" "$GCP_ARTIFACT_REPOSITORY/afaw-web:$CI_COMMIT_SHA"
    - docker push "$GCP_ARTIFACT_REPOSITORY/afaw-web:$CI_COMMIT_SHA"

deploy_cloud_run:
  stage: release
  image: google/cloud-sdk:590.0.1 # pinned; tag verified on Docker Hub
  needs: [publish_image]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - GCP_TOKEN="$(sh deploy/gcp_access_token.sh)"
    - export CLOUDSDK_AUTH_ACCESS_TOKEN="$GCP_TOKEN"
    - gcloud run deploy "$GCP_SERVICE_NAME" --image "$GCP_ARTIFACT_REPOSITORY/afaw-web:$CI_COMMIT_SHA" --update-env-vars "AFAW_COMMIT_SHA=$CI_COMMIT_SHA,AFAW_RELEASE_TAG=v0.$CI_PIPELINE_IID" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --quiet

# ---- monitor: measured facts and the dashboard ---------------------------------------------
monitor:
  stage: monitor
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH
  script:
    # GitLab sets CI_API_V4_URL and CI_PROJECT_ID; the project is public, so no token is sent.
    - python -m scripts.collect_facts --ref HEAD --out build/facts.json
    - python -m scripts.build_state --ref HEAD --out build/dashboard --facts build/facts.json
  artifacts:
    paths: [build/dashboard/]
    expire_in: 1 week

# Fails loudly if the live service does not answer /health or does not serve the derived views.
monitor_live:
  stage: monitor
  needs: [deploy_cloud_run]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - python -m scripts.check_live --url "$GCP_SERVICE_URL" --expect-sha "$CI_COMMIT_SHA" --page / --page /experiments/ --page /environment/

# Counts the automatic fix attempts of the merge request (cap of 3) and applies the merge rule.
# It merges only when the CI/CD variable AFAW_AUTO_MERGE is exactly "true" and AFAW_MERGE_TOKEN
# is set; without them it only prints its verdict. See docs/merge-guard.md.
merge_guard:
  stage: monitor
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - python -m scripts.merge_guard --mr "$CI_MERGE_REQUEST_IID"

# When a job failed and the hands-off switch is on, asks the Duo Developer Flow to repair it: a note
# that mentions the flow on the merge request, or an issue assigned to it on a branch with no merge
# request. Capped, one request per commit. Needs AFAW_MERGE_TOKEN (a person's token: a bot cannot
# start a flow). See docs/autohealing.md.
request_fix:
  stage: monitor
  rules:
    - if: $AFAW_AUTO_MERGE == "true"
      when: on_failure
  script:
    - python -m scripts.request_fix
